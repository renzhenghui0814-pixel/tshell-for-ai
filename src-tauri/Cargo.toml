[package]
name = "tshell"
version = "3.0.0"
description = "AI assistant working in your own SSH terminal"
authors = ["tora-zhren"]
license = "MIT"
edition = "2021"
# Match the toolchain we build with. A lower floor here is not free: cargo's
# MSRV-aware resolver would hold every dependency back to a version compatible
# with it, and some of those old versions no longer compile on a current rustc.
rust-version = "1.97"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
thiserror = "2.0.20"
dirs = "6.0.0"
uuid = { version = "1.24.0", features = ["v4"] }
sys-locale = "0.3.2"
russh = "0.62.6"
encoding_rs = "0.8.35"
# `test-util` is what lets the retry tests move a four-second backoff on
# without waiting four seconds. It adds an API, not behaviour.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "net", "test-util"] }
russh-sftp = "2.4.0"
regex = "1.11.1"
# rustls rather than the platform's TLS: one behaviour on all three targets, and
# no OpenSSL to find at build time. `stream` is what turns a response into the
# chunks an SSE reader needs.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
base64 = "0.22.1"
# One digest, for checking that a file arrived as it was sent.
sha2 = "0.10.9"
# Only for the AI log's filenames and record stamps, which have to be in local
# time -- the user is looking for "the one from this morning". Working the offset
# out by hand meant reading `TZ`, which is usually unset on Windows, so the
# stamps were silently UTC. `clock` is the only feature needed.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
fontdb = "0.24"

# Debug info is the single largest consumer of memory and disk in a dev build,
# and nothing here is debugged through a native debugger yet.
[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
